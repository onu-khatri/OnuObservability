extensions:
  health_check: { endpoint: "0.0.0.0:13133" }
receivers:
  otlp:
    protocols:
      grpc: { endpoint: "0.0.0.0:4317", max_recv_msg_size_mib: 4 }
      http: { endpoint: "0.0.0.0:4318" }
processors:
  memory_limiter: { check_interval: 1s, limit_mib: 192, spike_limit_mib: 48 }
  attributes/sanitize:
    actions:
      - { key: authorization, action: delete }
      - { key: http.request.header.authorization, action: delete }
      - { key: http.request.header.cookie, action: delete }
      - { key: http.response.header.set-cookie, action: delete }
      - { key: url.full, action: delete }
      - { key: url.query, action: delete }
      - { key: url.path, action: delete }
      - { key: http.url, action: delete }
      - { key: http.target, action: delete }
      - { key: exception.message, action: delete }
      - { key: exception.stacktrace, action: delete }
      - { key: db.statement, action: delete }
      - { key: rpc.request.metadata, action: delete }
      - { key: rpc.response.metadata, action: delete }
      - { key: gen_ai.prompt, action: delete }
      - { key: gen_ai.completion, action: delete }
      - { key: mcp.request.arguments, action: delete }
      - { key: mcp.response.result, action: delete }
  resource/sanitize:
    attributes:
      - { key: host.name, action: delete }
      - { key: process.command_args, action: delete }
      - { key: process.executable.path, action: delete }
      - { key: user.id, action: delete }
  tail_sampling:
    decision_wait: 10s
    num_traces: 5000
    expected_new_traces_per_sec: 100
    policies:
      - { name: errors, type: status_code, status_code: { status_codes: [ERROR] } }
      - { name: slow-requests, type: latency, latency: { threshold_ms: 2000 } }
      - { name: healthy-baseline, type: probabilistic, probabilistic: { sampling_percentage: 10 } }
  batch: { timeout: 1s, send_batch_size: 256, send_batch_max_size: 512 }
exporters:
  otlp_http/backend:
    endpoint: "${env:OTEL_BACKEND_ENDPOINT}"
    headers: { Authorization: "${env:OTEL_BACKEND_AUTHORIZATION}" }
    tls: { insecure: false }
    timeout: 5s
    sending_queue: { enabled: true, num_consumers: 2, queue_size: 512, block_on_overflow: false }
    retry_on_failure: { enabled: true, initial_interval: 1s, max_interval: 10s, max_elapsed_time: 60s }
service:
  extensions: [health_check]
  telemetry:
    logs: { level: info }
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus: { host: "0.0.0.0", port: 8888, without_scope_info: true, without_type_suffix: true, without_units: true }
  pipelines:
    traces: { receivers: [otlp], processors: [memory_limiter, attributes/sanitize, resource/sanitize, tail_sampling, batch], exporters: [otlp_http/backend] }
    metrics: { receivers: [otlp], processors: [memory_limiter, attributes/sanitize, resource/sanitize, batch], exporters: [otlp_http/backend] }
    logs: { receivers: [otlp], processors: [memory_limiter, attributes/sanitize, resource/sanitize, batch], exporters: [otlp_http/backend] }
