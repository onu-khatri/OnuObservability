extensions:
  health_check: { endpoint: "0.0.0.0:13133" }
receivers:
  otlp:
    protocols:
      grpc: { endpoint: "0.0.0.0:4317", max_recv_msg_size_mib: 4 }
      http: { endpoint: "0.0.0.0:4318" }
processors:
  memory_limiter: { check_interval: 100ms, limit_mib: 128, spike_limit_mib: 32 }
  attributes/sanitize:
    actions:
      - { key: authorization, action: delete }
      - { key: http.request.header.authorization, action: delete }
      - { key: http.request.header.cookie, action: delete }
      - { key: url.full, action: delete }
      - { key: url.query, action: delete }
      - { key: exception.message, action: delete }
      - { key: exception.stacktrace, action: delete }
      - { key: mcp.request.arguments, action: delete }
      - { key: mcp.response.result, action: delete }
  resource/sanitize:
    attributes:
      - { key: host.name, action: delete }
      - { key: process.command_args, action: delete }
      - { key: process.executable.path, action: delete }
      - { key: user.id, action: delete }
  batch: { timeout: 50ms, send_batch_size: 1, send_batch_max_size: 1 }
exporters:
  otlp_http/failure_backend:
    endpoint: "${env:OTEL_TEST_BACKEND_ENDPOINT}"
    timeout: 200ms
    sending_queue: { enabled: true, num_consumers: 1, queue_size: 4, block_on_overflow: false }
    retry_on_failure: { enabled: true, initial_interval: 100ms, max_interval: 500ms, max_elapsed_time: 5s }
service:
  extensions: [health_check]
  telemetry:
    logs: { level: info }
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus: { host: "0.0.0.0", port: 8888, without_scope_info: true, without_type_suffix: true, without_units: true }
  pipelines:
    traces: { receivers: [otlp], processors: [memory_limiter, attributes/sanitize, resource/sanitize, batch], exporters: [otlp_http/failure_backend] }
    metrics: { receivers: [otlp], processors: [memory_limiter, attributes/sanitize, resource/sanitize, batch], exporters: [otlp_http/failure_backend] }
    logs: { receivers: [otlp], processors: [memory_limiter, attributes/sanitize, resource/sanitize, batch], exporters: [otlp_http/failure_backend] }
